version: '3.8'

services:
  makemkv:
    build: .
    container_name: makemkv
    volumes:
      - ./input:/input     # Mount input directory for VIDEO_TS folders
      - ./output:/output   # Mount output directory
    # Run with interactive TTY - needed for MakeMKV CLI
    tty: true
    stdin_open: true
    # For GUI access, you would need to add X11 socket mounting and display env vars
    # Uncomment below for GUI access
    # environment:
    #   - DISPLAY=${DISPLAY}
    # volumes:
    #   - /tmp/.X11-unix:/tmp/.X11-unix
    restart: unless-stopped 